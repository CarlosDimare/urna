name: scrape elecciones

on:
  schedule:
    - cron: "0 * * * *"  # cada hora
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install deps
        run: npm ci

      - name: run scraper
        run: npm run scrape

      - name: commit changes
        if: github.event_name == 'schedule' || github.event.inputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/elecciones.db
          git commit -m "chore: actualizar elecciones (scrape automático)" || true
          git push || true
