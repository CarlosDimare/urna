name: scrape elecciones

on:
  schedule:
    - cron: "0 * * * *"  # cada hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install deps
        run: npm ci

      - name: run scraper (opencode-connected)
        run: npm run scrape

      - name: commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/elecciones.json
          git commit -m "chore: actualizar elecciones (scrape automático)" || true
          git push || true
