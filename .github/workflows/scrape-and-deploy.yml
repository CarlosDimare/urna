name: scrape y deploy elecciones

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"  # cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install deps
        run: npm ci

      - name: ejecutar scraper (datos reales en tiempo real)
        run: npx tsx scripts/scrape.ts || true

      - name: exportar datos para build estático
        run: npx tsx scripts/export-data.ts

      - name: commit datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/elecciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos, saltando commit"
          else
            git commit -m "chore: actualizar elecciones (scrape automático cada 30 min)"
            git push || true
          fi

      - name: build sitio estático
        run: npm run build

      - name: mover salida a /urna para GitHub Pages project site
        run: |
          mkdir -p out/urna
          find out -maxdepth 1 -mindepth 1 ! -name urna -exec mv {} out/urna/ \;

      - name: subir artifact a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "out/urna"

      - name: deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
